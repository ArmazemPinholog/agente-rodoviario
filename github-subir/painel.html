<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="referrer" content="no-referrer"/>
<title>Portal do Cliente — Pinholog</title>
<script>
(function(){ try { var t = localStorage.getItem('painel_tema'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* Portal do Cliente — página isolada: não contém chave do banco nem código do sistema interno.
   Lê apenas o arquivo publicado para este link (Supabase Storage, público só por URL secreta). */
:root, :root[data-theme="light"] {
  --bg:#f3f5f9; --s1:#ffffff; --s2:#f7f8fb; --s3:#eef1f6; --border:#e4e8ef; --border2:#d3d9e4;
  --blue:#3552e8; --blue2:#2b45cf; --blue3:#dde3ff; --blue4:#eef1ff;
  --text:#0f1523; --text2:#4a5468; --text3:#8a93a6;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);
  --font-sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-theme="dark"] {
  --bg:#0a0d14; --s1:#11151f; --s2:#0d1119; --s3:#171c28; --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.13);
  --blue:#8197ff; --blue2:#4f68ef; --blue3:rgba(129,151,255,.22); --blue4:rgba(129,151,255,.10);
  --text:#e8ecf4; --text2:#a3adc2; --text3:#6b7590;
  --shadow-sm:0 1px 0 rgba(255,255,255,.03) inset,0 1px 2px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    --bg:#0a0d14; --s1:#11151f; --s2:#0d1119; --s3:#171c28; --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.13);
    --blue:#8197ff; --blue2:#4f68ef; --blue3:rgba(129,151,255,.22); --blue4:rgba(129,151,255,.10);
    --text:#e8ecf4; --text2:#a3adc2; --text3:#6b7590;
    --shadow-sm:0 1px 0 rgba(255,255,255,.03) inset,0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh;}
.pt-top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.pt-top-in{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px;}
.pt-logo{background:#fff;border:1px solid var(--border);border-radius:10px;padding:5px 9px;display:flex;align-items:center;}
.pt-logo img{height:24px;width:auto;display:block;}
.pt-marca{display:flex;flex-direction:column;line-height:1.2;}
.pt-marca b{font-size:14px;font-weight:800;}
.pt-marca span{font-size:11px;color:var(--text3);}
.pt-dir{margin-left:auto;display:flex;align-items:center;gap:8px;}
.pt-live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);font-weight:600;white-space:nowrap;}
.pt-live i{width:7px;height:7px;border-radius:50%;background:#0ca30c;box-shadow:0 0 0 3px rgba(12,163,12,.18);}
.pt-ic{width:34px;height:34px;border-radius:9px;border:1px solid var(--border2);background:var(--s1);color:var(--text2);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;}
.pt-bt{height:34px;border-radius:9px;border:1px solid var(--border2);background:var(--s1);color:var(--text2);cursor:pointer;font:700 12.5px var(--font-sans);display:inline-flex;align-items:center;gap:6px;padding:0 11px;}
.pt-bt:hover{color:var(--text);border-color:var(--blue);} .pt-bt[disabled]{opacity:.6;cursor:wait;}
.pt-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);font-weight:700;font-size:13px;padding:10px 16px;border-radius:10px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);}
.pt-ic:hover{color:var(--text);border-color:var(--blue);}
main{max-width:1280px;margin:0 auto;padding:26px 24px 60px;}
.pt-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.pt-kicker{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);}
.pt-h1{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:4px 0;}
.pt-sub{font-size:13px;color:var(--text2);}
.seg{display:inline-flex;gap:2px;background:var(--s2);border:1px solid var(--border);border-radius:11px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none;}
.seg button{border:none;background:transparent;color:var(--text2);font:700 12.5px var(--font-sans);height:32px;padding:0 13px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.seg button.on{background:var(--s1);color:var(--text);box-shadow:var(--shadow-sm),0 0 0 1px var(--border);}
.pt-msg{max-width:520px;margin:12vh auto;text-align:center;background:var(--s1);border:1px solid var(--border);border-radius:18px;padding:36px 28px;box-shadow:var(--shadow-sm);}
.pt-msg h2{font-size:20px;font-weight:800;margin:10px 0 6px;}
.pt-msg p{color:var(--text2);line-height:1.6;}
.pt-sk{height:120px;border-radius:16px;background:linear-gradient(90deg,var(--s2),var(--s3),var(--s2));background-size:300% 100%;animation:sk 1.4s infinite;margin-bottom:14px;}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
footer{max-width:1280px;margin:0 auto;padding:0 24px 40px;color:var(--text3);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:18px;}
@media (max-width:640px){
  .pt-bt span{display:none;} .pt-bt{padding:0 9px;}
  .pt-top-in{padding:10px 14px;} .pt-marca span{display:none;} .pt-live span{display:none;}
  main{padding:18px 14px 40px;} .pt-h1{font-size:25px;}
  .pt-head .seg{width:100%;} .pt-head .seg button{flex:1;}
  footer{padding:16px 14px 30px;}
}
@media print{ .pt-top,.pt-head .seg,.dz-busca{display:none!important;} body{background:#fff;} }
/* ══════════ Dashboards (motor compartilhado app + Portal do Cliente) ══════════ */
:root, :root[data-theme="light"] {
  --dz-c1:#2a78d6; --dz-c2:#eb6834; --dz-c3:#1baf7a; --dz-c4:#eda100; --dz-c5:#e87ba4; --dz-c6:#008300;
  --dz-mute:#b9b8b1; --dz-grid:#eceef2; --dz-base:#cfd4dd; --dz-area:rgba(42,120,214,.10);
  --dz-good:#0ca30c; --dz-warn:#fab219; --dz-crit:#d03b3b; --dz-good-tx:#006300;
}
:root[data-theme="dark"] {
  --dz-c1:#3987e5; --dz-c2:#d95926; --dz-c3:#199e70; --dz-c4:#c98500; --dz-c5:#d55181; --dz-c6:#008300;
  --dz-mute:#4a4f5c; --dz-grid:rgba(255,255,255,.06); --dz-base:rgba(255,255,255,.16); --dz-area:rgba(57,135,229,.14);
  --dz-good-tx:#3ccf94;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    --dz-c1:#3987e5; --dz-c2:#d95926; --dz-c3:#199e70; --dz-c4:#c98500; --dz-c5:#d55181; --dz-c6:#008300;
    --dz-mute:#4a4f5c; --dz-grid:rgba(255,255,255,.06); --dz-base:rgba(255,255,255,.16); --dz-area:rgba(57,135,229,.14);
    --dz-good-tx:#3ccf94;
  }
}
.dz-top{display:grid;grid-template-columns:minmax(280px,1.05fr) 2fr;gap:14px;margin-bottom:14px;}
.dz-hero{position:relative;overflow:hidden;background:var(--s1);border:1px solid var(--border);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;}
.dz-hero::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,var(--dz-area),transparent);pointer-events:none;}
.dz-hero-l{font-size:12.5px;font-weight:700;color:var(--text2);}
.dz-hero-v{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:6px 0 4px;color:var(--text);}
.dz-hero-s{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:12px;color:var(--text3);}
.dz-per{color:var(--text3);}
.dz-hero-split{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto;padding-top:18px;border-top:1px solid var(--border);}
.dz-hero-split div{display:flex;flex-direction:column;padding-top:14px;}
.dz-hero-split b{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.02em;}
.dz-hero-split span{font-size:11.5px;color:var(--text3);}
.dz-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
.dz-stat{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:2px;min-width:0;}
.dz-stat-l{font-size:12px;font-weight:700;color:var(--text2);}
.dz-stat-v{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--text);line-height:1.2;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dz-stat-s{font-size:11.5px;color:var(--text3);}
.dz-delta{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;margin-top:6px;}
.dz-delta span{font-weight:500;color:var(--text3);}
.dz-delta.bom{color:var(--dz-good-tx);} .dz-delta.ruim{color:var(--dz-crit);} .dz-delta.neutro{color:var(--text3);font-weight:600;}
.dz-card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-sm);min-width:0;margin-bottom:14px;}
.dz-card header{margin-bottom:14px;}
.dz-card h3{font-size:14.5px;font-weight:800;color:var(--text);letter-spacing:-.01em;}
.dz-card header p{font-size:12px;color:var(--text3);margin-top:2px;}
.dz-grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px;}
.dz-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
.dz-grid2 > .dz-card,.dz-grid3 > .dz-card{margin-bottom:14px;}
.dz-chart{width:100%;min-height:220px;}
.dz-chart svg{display:block;overflow:visible;}
.dz-grid{stroke:var(--dz-grid);stroke-width:1;}
.dz-base{stroke:var(--dz-base);stroke-width:1;}
.dz-ax{font-size:11px;fill:var(--text3);font-family:var(--font-sans);font-variant-numeric:tabular-nums;}
.dz-lab{font-size:11px;font-weight:700;fill:var(--text2);font-family:var(--font-sans);}
.dz-area{fill:var(--dz-area);}
.dz-line{fill:none;stroke:var(--dz-c1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
.dz-dot,.dz-cross-dot{fill:var(--dz-c1);stroke:var(--s1);stroke-width:2;}
.dz-cross{stroke:var(--text3);stroke-width:1;}
.dz-hit{cursor:crosshair;}
.dz-hbars{display:flex;flex-direction:column;gap:9px;}
.dz-hbar{display:grid;grid-template-columns:minmax(90px,44%) 1fr auto;align-items:center;gap:10px;font-size:12.5px;border-radius:6px;outline-offset:2px;}
.dz-hbar-k{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dz-hbar-t{height:10px;}
.dz-hbar-f{height:10px;background:var(--dz-c1);border-radius:0 4px 4px 0;transition:filter .15s;}
.dz-hbar-f.outros{background:var(--dz-mute);}
.dz-hbar:hover .dz-hbar-f{filter:brightness(1.15);}
.dz-hbar-v{font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.dz-mix{display:flex;gap:2px;height:14px;border-radius:5px;overflow:hidden;margin:2px 0 14px;}
.dz-mix-s{min-width:3px;transition:filter .15s;outline-offset:-2px;}
.dz-mix-s:hover{filter:brightness(1.15);}
.dz-leg{list-style:none;display:flex;flex-direction:column;gap:7px;margin:0;padding:0;}
.dz-leg li{display:grid;grid-template-columns:10px 1fr auto auto;align-items:center;gap:8px;font-size:12.5px;color:var(--text2);}
.dz-leg i{width:10px;height:10px;border-radius:3px;}
.dz-leg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dz-leg b{color:var(--text);font-variant-numeric:tabular-nums;}
.dz-leg em{font-style:normal;color:var(--text3);font-size:11.5px;min-width:64px;text-align:right;font-variant-numeric:tabular-nums;}
.dz-meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;}
.dz-meter-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--text2);font-weight:700;}
.dz-meter-top b{font-size:26px;color:var(--text);letter-spacing:-.03em;}
.dz-meter-t{position:relative;height:10px;border-radius:5px;background:var(--s3);margin:8px 0;}
.dz-meter-f{height:100%;border-radius:5px;background:var(--dz-c1);}
.dz-meter.atencao .dz-meter-f{background:var(--dz-warn);} .dz-meter.critico .dz-meter-f{background:var(--dz-crit);} .dz-meter.bom .dz-meter-f{background:var(--dz-good);}
.dz-meter-meta{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);border-radius:2px;transform:translateX(-1px);}
.dz-meter-s{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--text3);}
.dz-status{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--text2);}
.dz-status i{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-style:normal;font-size:10px;color:#fff;font-weight:900;}
.dz-status.bom i{background:var(--dz-good);} .dz-status.atencao i{background:var(--dz-warn);color:#1a1a19;} .dz-status.critico i{background:var(--dz-crit);}
.dz-tbl-wrap{display:flex;flex-direction:column;gap:10px;}
.dz-busca{max-width:340px;height:36px;padding:6px 12px;font-size:13px;background:var(--s2);border:1px solid var(--border2);border-radius:9px;color:var(--text);}
.dz-tbl{overflow:auto;max-height:440px;border:1px solid var(--border);border-radius:12px;}
.dz-tbl table{width:100%;border-collapse:collapse;font-size:12.5px;}
.dz-tbl th{position:sticky;top:0;background:var(--s2);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:9px 12px;border-bottom:1px solid var(--border2);white-space:nowrap;z-index:1;}
.dz-tbl td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:top;background:transparent;}
.dz-tbl td b{color:var(--text);}
.dz-tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.dz-tbl tr:hover td{background:var(--s3);}
.dz-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.dz-seta{color:var(--text3);}
.dz-pill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600;color:var(--text);}
.dz-pill i{width:8px;height:8px;border-radius:50%;}
.dz-vazio{padding:24px 6px;text-align:center;color:var(--text3);font-size:12.5px;}
.dz-tip{position:fixed;z-index:20000;display:none;pointer-events:none;background:var(--s1);color:var(--text);border:1px solid var(--border2);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.28);padding:9px 11px;font-size:12px;min-width:140px;max-width:280px;}
.dz-tip-h{font-weight:700;color:var(--text2);margin-bottom:4px;}
.dz-tip-r{display:flex;align-items:center;gap:6px;margin-top:2px;}
.dz-tip-r i{width:12px;height:2px;border-radius:2px;flex:none;}
.dz-tip-r b{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;}
.dz-tip-r span{color:var(--text3);}
.span2{}
@media (max-width:1100px){ .dz-top{grid-template-columns:1fr;} .dz-grid2{grid-template-columns:1fr;} .dz-grid3{grid-template-columns:1fr 1fr;} }
@media (max-width:700px){
  .dz-grid3{grid-template-columns:1fr;}
  .dz-tiles{grid-template-columns:1fr 1fr;gap:10px;}
  .dz-stat{padding:13px 14px;border-radius:14px;}
  .dz-stat-v{font-size:22px;}
  .dz-hero{padding:18px;}
  .dz-hero-v{font-size:48px;}
  .dz-card{padding:15px 14px;}
  .dz-hbar{grid-template-columns:minmax(70px,34%) 1fr auto;}
}
@media print{ .dz-card,.dz-stat,.dz-hero{box-shadow:none;break-inside:avoid;} }
/* aba Dashboards (app interno) */
.dz-filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--border);}
.dz-filtros select{width:auto;min-width:190px;height:38px;padding:6px 12px;background:var(--s1);}
.dz-custom{display:none;align-items:center;gap:6px;}
.dz-custom input{height:38px;width:150px;padding:6px 10px;background:var(--s1);}
.dz-custom span{font-size:12px;color:var(--text3);}
.dz-root{transition:opacity .2s;}
.dz-preview-note{font-size:12.5px;color:var(--text2);background:var(--blue4);border:1px solid var(--blue3);border-radius:12px;padding:10px 14px;margin-bottom:14px;}
.dz-links{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.dz-links-h{font-size:12.5px;font-weight:800;color:var(--text);margin-bottom:6px;}
.dz-link{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--border);}
.dz-link.vencido{opacity:.55;}
.dz-link-i{display:flex;flex-direction:column;min-width:0;}
.dz-link-i b{font-size:13px;color:var(--text);}
.dz-link-i span{font-size:11.5px;color:var(--text3);}
.dz-link-a{display:flex;gap:6px;flex-wrap:wrap;}
.dz-opt{display:flex;align-items:center;gap:8px;margin-top:12px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;}
.dz-link-ok{margin-top:14px;display:flex;flex-direction:column;gap:10px;font-size:13px;font-weight:700;color:var(--text);background:var(--pastel-green);border-radius:12px;padding:14px;}
.dz-link-ok input{font-family:var(--font-mono);font-size:12px;background:var(--s1);}
.dz-setup{margin-top:14px;background:var(--pastel-orange);color:var(--text);border-radius:12px;padding:14px;font-size:12.5px;display:flex;flex-direction:column;gap:8px;}
.dz-setup textarea{font-family:var(--font-mono);font-size:11px;background:var(--s1);min-height:150px;}
@media (max-width:640px){
  .dz-filtros{margin-left:-12px;margin-right:-12px;padding:8px 12px;}
  .dz-filtros .seg{flex:1 1 100%;}
  .dz-filtros .seg .btn{flex:1;padding:0 8px;}
  .dz-filtros select{flex:1 1 100%;}
}
@media print{
  .tabs,header,.dz-filtros,.pg-actions,#v2-dock,.dz-links{display:none!important;}
  body{padding:0!important;background:#fff!important;}
}
@media (max-width:640px){
  header .badges .badge-c{display:none!important;}
  header .badges .badge-a{max-width:34px!important;padding:0 8px!important;}
  .dz-filtros .seg{min-width:0;}
}
.dz-card header,.dz-card > header{display:block!important;padding:0!important;margin:0 0 14px!important;background:none!important;border:0!important;box-shadow:none!important;}
.dz-tiles.n6{grid-template-columns:repeat(3,minmax(0,1fr));}
.dz-tiles.n4{grid-template-columns:repeat(2,minmax(0,1fr));}
@media (max-width:700px){ .dz-tiles.n6,.dz-tiles.n4{grid-template-columns:1fr 1fr;} }
.dz-mais{font-size:11.5px;color:var(--text3);margin-top:10px;}
/* ── Ritmo: processos por dia / semana / mês ── */
.dz-card .dz-rt-h{display:flex!important;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.dz-rt-h h3{font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--text);margin:0;}
.dz-rt-h p{font-size:12px;color:var(--text3);margin-top:2px;}
.dz-seg{display:inline-flex;gap:2px;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:3px;}
.dz-seg button{border:0;background:transparent;color:var(--text2);font:700 12px var(--font-sans);height:28px;padding:0 12px;border-radius:7px;cursor:pointer;}
.dz-seg button.on{background:var(--s1);color:var(--text);box-shadow:0 0 0 1px var(--border),0 1px 2px rgba(0,0,0,.08);}
.dz-rt-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px;}
.dz-rt{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;}
.dz-rt-l{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);}
.dz-rt-v{font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--text);line-height:1.15;}
.dz-rt-c{font-size:12px;color:var(--text3);}
.dz-rt-c b{color:var(--text2);font-weight:700;}
.dz-rt-c i{font-style:normal;font-size:10px;color:var(--text3);}
.dz-cols{display:flex;align-items:stretch;gap:6px;height:190px;padding-top:4px;}
.dz-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:stretch;cursor:default;}
.dz-col-v{height:18px;font-size:11.5px;font-weight:700;color:var(--text2);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;}
.dz-col-t{flex:1;display:flex;align-items:flex-end;border-bottom:1px solid var(--dz-base);}
.dz-col-f{width:100%;max-width:44px;margin:0 auto;background:var(--dz-c1);opacity:.55;border-radius:4px 4px 0 0;transition:opacity .15s;}
.dz-col.atual .dz-col-f{opacity:1;}
.dz-col-k .sm{display:none;}
.dz-col:hover .dz-col-f{opacity:.9;}
.dz-col-k{font-size:10.5px;color:var(--text3);text-align:center;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:clip;font-variant-numeric:tabular-nums;}
@media (max-width:700px){
  .dz-rt-tiles{grid-template-columns:1fr 1fr 1fr;gap:8px;} .dz-rt{padding:10px;} .dz-rt-v{font-size:22px;}
  .dz-rt-c{font-size:11px;} .dz-cols{gap:3px;height:160px;}
  .dz-col-k .lg{display:none;} .dz-col-k .sm{display:inline!important;} .dz-col-k{font-size:10px;overflow:visible;}
  .dz-col-v{font-size:10.5px;}
}
@media (max-width:420px){ .dz-rt-tiles{grid-template-columns:1fr;} .dz-rt{flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:4px 10px;} }
/* ── Exportação PDF (folha fora da tela) ── */
.dz-pdf-host{font-family:var(--font-sans);color:var(--text);background:#fff;}
.dz-pdf-cab{display:flex;align-items:center;gap:18px;padding:22px 24px;margin-bottom:14px;border-radius:16px;background:#0b1f3a;color:#fff;}
.dz-pdf-logo{background:#fff;border-radius:10px;padding:8px 12px;display:flex;align-items:center;}
.dz-pdf-logo img{height:34px;width:auto;display:block;}
.dz-pdf-tit span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8fb8ff;}
.dz-pdf-tit h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px;color:#fff;}
.dz-pdf-tit p{font-size:12.5px;color:#c9d6ea;margin:0;} .dz-pdf-tit p b{color:#fff;}
.dz-pdf-host .dz-card,.dz-pdf-host .dz-hero,.dz-pdf-host .dz-stat{box-shadow:none!important;}
.dz-pdf-host .dz-tbl{max-height:none!important;overflow:visible!important;}
.dz-pdf-host .dz-seg{display:none!important;}
/* export modal */
.dx-opcoes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 12px;}
.dx-op{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--border2);background:var(--s1);border-radius:14px;padding:16px;cursor:pointer;color:var(--text);font:inherit;transition:border-color .15s,transform .15s;}
.dx-op:hover{border-color:var(--blue);transform:translateY(-1px);}
.dx-op b{font-size:15px;font-weight:800;} .dx-op span{font-size:12.5px;color:var(--text2);line-height:1.45;}
.dx-op .dx-ic{font-size:22px;}
.dx-op[disabled]{opacity:.55;pointer-events:none;}
.dx-pbi{margin-top:12px;border:1px dashed var(--border2);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--text2);line-height:1.55;}
.dx-pbi b{color:var(--text);} .dx-pbi input{width:100%;margin:6px 0;font-size:12px;}
.dx-pbi ol{margin:6px 0 0 18px;padding:0;}
@media (max-width:560px){ .dx-opcoes{grid-template-columns:1fr;} }
.dz-pdf-host .dz-hero::after{display:none!important;}
/* ── Barras: listas completas ── */
.dz-hbars.longo{max-height:318px;overflow-y:auto;padding-right:6px;scrollbar-width:thin;}
.dz-hbar-v small{font-size:11px;font-weight:600;color:var(--text3);margin-left:6px;}
.dz-cat .dz-hbar-k{display:flex;flex-direction:column;line-height:1.25;}
.dz-cat .dz-hbar-k b{color:var(--text);font-weight:700;} .dz-cat .dz-hbar-k span{font-size:11px;color:var(--text3);}
.dz-cat .dz-hbar-f{height:12px;}
/* ── Matriz de detalhamento ── */
:root{--dz-seq:42 120 214;}
:root[data-theme="dark"]{--dz-seq:57 135 229;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dz-seq:57 135 229;}}
.dz-kick{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);}
.dz-card .dz-mz-h{display:flex!important;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;}
.dz-mz-h h3{font-size:16px;font-weight:800;color:var(--text);margin:2px 0 0;}
.dz-mz-n{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums;} .dz-mz-n b{color:var(--text);}
.dz-mz-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
.dz-mz-ctl .dz-seg{overflow-x:auto;max-width:100%;scrollbar-width:none;}
.dz-mz-ctl .dz-seg button{white-space:nowrap;}
.dz-mz-busca{flex:1 1 180px;min-width:150px;margin:0!important;height:34px;}
.dz-chip{height:32px;border-radius:9px;border:1px solid var(--border2);background:var(--s1);color:var(--text2);font:700 12px var(--font-sans);padding:0 12px;cursor:pointer;white-space:nowrap;}
.dz-chip:hover{color:var(--text);border-color:var(--blue);}
.dz-mz-tbl{overflow:auto;max-height:470px;border:1px solid var(--border);border-radius:12px;}
.dz-mz-tbl table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;}
.dz-mz-tbl th,.dz-mz-tbl td{padding:7px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
.dz-mz-tbl th{position:sticky;top:0;z-index:2;background:var(--s2);color:var(--text2);font-weight:700;text-align:left;}
.dz-mz-tbl th.num,.dz-mz-tbl td.num{text-align:center;min-width:64px;}
.dz-mz-tbl th:first-child,.dz-mz-tbl td:first-child{position:sticky;left:0;z-index:1;background:var(--s1);max-width:260px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--border);}
.dz-mz-tbl th:first-child{z-index:3;background:var(--s2);}
.dz-mz-k{color:var(--text);font-weight:600;}
.dz-mz-c{background:rgb(var(--dz-seq) / var(--a));color:var(--text);font-weight:600;}
.dz-mz-tbl td.dz-mz-tot{font-weight:800;color:var(--text);border-left:1px solid var(--border);}
.dz-mz-tbl th.dz-mz-tot{border-left:1px solid var(--border);}
.dz-mz-tbl tfoot td{position:sticky;bottom:0;background:var(--s2);font-weight:800;color:var(--text);border-top:1px solid var(--border2);border-bottom:0;}
.dz-mz-tbl tfoot td:first-child{z-index:3;background:var(--s2);}
.dz-mz-tbl tbody tr:hover td{filter:brightness(.97);}
.dz-pdf-host .dz-mz-ctl{display:none!important;}
.dz-pdf-host .dz-mz-tbl{max-height:none!important;overflow:visible!important;}
@media (max-width:700px){ .dz-mz-tbl{max-height:420px;} .dz-mz-tbl th,.dz-mz-tbl td{padding:6px 9px;} .dz-mz-tbl th:first-child,.dz-mz-tbl td:first-child{max-width:150px;} }
.dz-mz-acts{display:flex;gap:6px;flex-wrap:nowrap;}
.dz-hbar-k{white-space:normal!important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3;word-break:break-word;}
.dz-cat .dz-hbar-k{display:flex;}
.dz-pdf-host .dz-mz-tbl th,.dz-pdf-host .dz-mz-tbl td,.dz-pdf-host .dz-tbl th{position:static!important;}

</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════════════════
// AgenteRodo — motor de Dashboards (compartilhado entre o app interno e o

// ═══════════════════════════════════════════════════════════════════════
const Dash = (() => {
  const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim().replace(/\s+/g, ' ');
  function num(txt) {

  }

  const fmtBRL = v => 'R$ ' + compacto(v);
  const fmtPct = p => (p == null || isNaN(p)) ? '—' : fmtDec(p * 100, 0) + '%';
  function fmtHoras(h) {
    if (h == null || isNaN(h)) return '—';
    if (h < 1) return Math.round(h * 60) + ' min';

  }
  const dataBR = iso => { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso || ''); };

  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  const ETAPAS = {

  };
  function fase(p) {
    const s = norm(p.status);

    if (s.includes('finaliz') || s.includes('faturar') || p.etapa === 'CONCLUIDO') return 'entregue';
    if (s.includes('transito') || s.includes('chegada') || s.includes('descarga') || s.includes('carregamento')) return 'transito';
    if (s.includes('agendado') || s.includes('programac') || s.includes('liberado') || s.includes('doc enviado')) return 'programado';
    return 'preparacao';
  }
  const FASES = [
    { id: 'preparacao', rotulo: 'Em preparação', cor: 'var(--dz-c4)' },
    { id: 'programado', rotulo: 'Programado', cor: 'var(--dz-c1)' },
    { id: 'transito', rotulo: 'Em trânsito', cor: 'var(--dz-c2)' },
    { id: 'entregue', rotulo: 'Entregue', cor: 'var(--dz-c3)' },

  // ── Normalização: linha do Supabase (espelho da planilha) → processo ─
  function normalizar(row) {
    const t = row.todos || {};

    const v = cab => { const k = mapa[norm(cab)]; return k !== undefined ? String(t[k] == null ? '' : t[k]).trim() : ''; };
    const nfTxt = v('NF');
    const volTxt = v('VOLUME');

    const etapa = (_man && _man !== _auto && (row.status_processo_manual_base === '~' || row.status_processo_manual_base === _auto)) ? _man : _auto;
    return {
      linha: row.linha, cliente: row.cliente || v('CLIENTE'), cnpj: v('CNPJ'), ref: row.referencia || v('REFERÊNCIA CLIENTE'),
      status: row.status || v('STATUS'), etapa,
      categoria: v('CATEGORIA').toUpperCase(), tipoCarga: v('TIPO DE CARGA'),
      origem: v('ORIGEM'), destino: v('DESTINO'), localColeta: row.local_coleta || v('LOCAL COLETA'), localEntrega: row.local_entrega || v('LOCAL DE ENTREGA'),
      dataReceb: row.data_recebimento || '', dataColeta: row.data_carregamento || v('DATA COLETA'), dataEntrega: row.data_descarga || v('DATA ENTREGA'),
      volume: /\d/.test(volTxt) ? (parseInt(volTxt.match(/\d+/)[0], 10) || 0) : 0,
      peso: num(v('PESO (KG)')), medidas: v('OBSERVAÇÃO CARGA'),
      nfValor: /^\s*(R\$\s*)?[\d.,]+\s*$/.test(nfTxt) ? num(nfTxt) : 0,
      tipoVeiculo: v('TIPO DE VEICULO'), placa: v('PLACA 1'), motorista: v('MOTORISTA'),

      custo: num(v('VALOR TOTAL')), frete: num(v('VALOR FRETE')), proposta: num(v('VALOR PROPOSTA')),

  }

  function paraCliente(p, opcoes) {
    const o = {}; CAMPOS_CLIENTE.forEach(k => { o[k] = p[k]; });
    if (opcoes && opcoes.motorista) { o.placa = p.placa; o.motorista = p.motorista; }
    if (!(opcoes && opcoes.sla)) { delete o.h1; delete o.ok1; delete o.hProg; delete o.okProg; }

  }

  // ── Período ────────────────────────────────────────────────────────
  const dataRef = p => p.dataColeta || p.dataReceb || p.dataEntrega || '';
  function periodo(preset, deTxt, ateTxt) {
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    let de, ate = new Date(hoje);
    if (preset === 'custom') { de = paraData(deTxt); ate = paraData(ateTxt) || ate; }
    else if (preset === 'mes') de = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    else if (preset === 'mesant') { de = new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1); ate = new Date(hoje.getFullYear(), hoje.getMonth(), 0); }
    else if (preset === 'tudo') de = null;
    else de = new Date(hoje.getTime() - (Number(preset) - 1) * diaMs);
    return { de, ate, preset };
  }
  function noPeriodo(procs, per) {
    const a = per.de ? iso(per.de) : '', b = per.ate ? iso(per.ate) : '9999';
    return procs.filter(p => { const d = dataRef(p); if (!d) return !per.de; return (!a || d >= a) && d <= b; });
  }
  function periodoAnterior(per) {
    if (!per.de) return null;
    const len = Math.round((per.ate - per.de) / diaMs) + 1;
    return { de: new Date(per.de.getTime() - len * diaMs), ate: new Date(per.de.getTime() - diaMs) };
  }

  // ── Métricas ───────────────────────────────────────────────────────
  function contar(lista, chave, top) {
    const m = new Map();
    lista.forEach(p => { const k = (typeof chave === 'function' ? chave(p) : p[chave]) || '(não informado)'; m.set(k, (m.get(k) || 0) + 1); });
    const arr = [...m.entries()].map(([k, n]) => ({ k, n })).sort((a, b) => b.n - a.n);
    if (top && arr.length > top) { const resto = arr.slice(top - 1).reduce((s, x) => s + x.n, 0); return arr.slice(0, top - 1).concat([{ k: 'Outros', n: resto, outros: true }]); }
    return arr;
  }
  function somar(lista, chave, fnChave, top) {
    const m = new Map();
    lista.forEach(p => { const k = fnChave(p) || '(não informado)'; m.set(k, (m.get(k) || 0) + (p[chave] || 0)); });
    const arr = [...m.entries()].map(([k, n]) => ({ k, n })).filter(x => x.n > 0).sort((a, b) => b.n - a.n);
    if (top && arr.length > top) { const resto = arr.slice(top - 1).reduce((s, x) => s + x.n, 0); return arr.slice(0, top - 1).concat([{ k: 'Outros', n: resto, outros: true }]); }
    return arr;
  }
  function metricas(lista) {
    const ativos = lista.filter(p => fase(p) !== 'cancelado');
    const m = {
      total: ativos.length, cancelados: lista.length - ativos.length,
      andamento: ativos.filter(p => fase(p) !== 'entregue').length,
      entregues: ativos.filter(p => fase(p) === 'entregue').length,
      transito: ativos.filter(p => fase(p) === 'transito').length,
      peso: ativos.reduce((s, p) => s + (p.peso || 0), 0),
      volumes: ativos.reduce((s, p) => s + (p.volume || 0), 0),
      nf: ativos.reduce((s, p) => s + (p.nfValor || 0), 0),
      custo: ativos.reduce((s, p) => s + (p.custo || 0), 0), comCusto: ativos.filter(p => p.custo > 0).length,
      travas: ativos.filter(p => p.trava).length,
    };
    const r1 = ativos.filter(p => p.ok1 === true || p.ok1 === false);
    m.sla1 = r1.length ? r1.filter(p => p.ok1).length / r1.length : null; m.sla1n = r1.length;
    const h1 = ativos.map(p => p.h1).filter(h => typeof h === 'number' && h >= 0 && h < 240).sort((a, b) => a - b);
    m.h1med = h1.length ? h1[Math.floor(h1.length / 2)] : null;
    const rp = ativos.filter(p => p.okProg === true || p.okProg === false);
    m.slaProg = rp.length ? rp.filter(p => p.okProg).length / rp.length : null; m.slaProgn = rp.length;
    const lead = ativos.map(p => { const a = paraData(p.dataColeta), b = paraData(p.dataEntrega); return a && b && b >= a ? (b - a) / diaMs : null; }).filter(x => x !== null && x < 60).sort((a, b) => a - b);
    m.leadMed = lead.length ? lead[Math.floor(lead.length / 2)] : null;
    m.leadMedia = lead.length ? lead.reduce((s, x) => s + x, 0) / lead.length : null;

    return m;
  }
  function serieTempo(lista, per) {
    const datas = lista.map(dataRef).filter(Boolean).sort();
    if (!datas.length) return { pontos: [], passo: 'dia' };
    const ini = per.de || paraData(datas[0]); const fim = per.ate || paraData(datas[datas.length - 1]);
    const dias = Math.round((fim - ini) / diaMs) + 1;
    const passo = dias <= 35 ? 'dia' : 'semana';
    const chave = d => { if (passo === 'dia') return iso(d); const x = new Date(d); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return iso(x); };

    for (let d = new Date(ini); d <= fim; d = new Date(d.getTime() + diaMs)) { const k = chave(d); if (!buckets.has(k)) buckets.set(k, { k, n: 0, entregues: 0, peso: 0 }); }
    lista.forEach(p => { const d = paraData(dataRef(p)); if (!d) return; const b = buckets.get(chave(d)); if (b && fase(p) !== 'cancelado') { b.n++; b.peso += p.peso || 0; if (fase(p) === 'entregue') b.entregues++; } });

  // ── Componentes visuais ────────────────────────────────────────────

  function tip() {

  function mostrarTip(ev, linhas) {

    if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;

  // liga tooltips declarativos: data-tip='[{"v":"12","r":"processos"}]'
  function ligarTips(root) {

      el.addEventListener('pointerleave', esconderTip);

  function delta(atual, anterior, bomSubir) {

  }

  // Área com crosshair (uma série; a linha de entregues é só no tooltip)
  function area(el, serie, opts) {
    const pts = serie.pontos;

    const W = Math.max(280, el.clientWidth || 600), H = opts.altura || 220, ml = 34, mr = 12, mt = 16, mb = 26;
    const max = Math.max(...pts.map(p => p.n)) || 1;
    const passoY = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : max <= 50 ? 10 : max <= 100 ? 20 : Math.ceil(max / 5 / 50) * 50;
    const topo = Math.ceil(max / passoY) * passoY;

    const y = v => mt + (H - mt - mb) * (1 - v / topo);

    const ult = pts.length - 1;
    el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || 'Processos ao longo do tempo')}">

      const p = pts[i]; const d = paraData(p.k);
      cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.style.display = '';

  // Barras horizontais (ranking) — valor na ponta, 1 cor
  function barrasH(itens, fmt, opts) {
    opts = opts || {};

    const total = opts.total || itens.reduce((s, i) => s + i.n, 0);

    const longo = itens.length > 10 && !_modoPdf;
    return `<div class="dz-hbars ${longo ? 'longo' : ''}">${itens.map(i => `
      <div class="dz-hbar" ${tipAttr([{ v: i.k }, { v: fmt(i.n), r: opts.unidade || '' }, { v: fmtPct(i.n / total), r: 'do total' }])}>
        <div class="dz-hbar-k" title="${esc(i.k)}">${esc(i.k)}</div>
        <div class="dz-hbar-t"><div class="dz-hbar-f ${i.outros ? 'outros' : ''}" style="width:${Math.max(1.5, i.n / max * 100).toFixed(1)}%;${opts.cor ? 'background:' + opts.cor : ''}"></div></div>
        <div class="dz-hbar-v">${fmt(i.n)}${opts.pct ? `<small>${fmtPct(i.n / total)}</small>` : ''}</div>
      </div>`).join('')}</div>${longo ? `<div class="dz-mais">${fmtInt(itens.length)} itens · role para ver todos</div>` : ''}${rodape}`;
  }
  // Barra 100% empilhada + legenda (mix) — até 6 categorias, gap de 2px

  // ── Montagem do painel ─────────────────────────────────────────────

    host.innerHTML = `<div class="dz-pdf-cab">
        ${logo ? `<div class="dz-pdf-logo"><img src="${logo}" alt=""></div>` : ''}
        <div class="dz-pdf-tit"><span>${Dash.esc(meta.kicker || 'Relatório de embarques')}</span><h1>${Dash.esc(meta.cliente || 'Operação Pinholog')}</h1>
        <p>Período: <b>${Dash.esc(txtPer)}</b> · Gerado em ${Dash.esc(new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }))}</p></div>
      </div><div class="dz-pdf-corpo"></div>`;
    document.body.appendChild(host);
    try {
      Dash.render(host.querySelector('.dz-pdf-corpo'), procs, { modo: meta.modo, periodo: per, opcoes: meta.opcoes || {}, pdf: true });
      quebrarTabelas(host);
      const blocos = [host.querySelector('.dz-pdf-cab')];
      host.querySelector('.dz-pdf-corpo').childNodes.forEach(n => { if (n.nodeType === 1) blocos.push(n); });
      // grades (2/3 colunas) viram um bloco só; já estão agrupadas no DOM
      await new Promise(r => setTimeout(r, 60));
      const doc = new jsp.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
      const PW = 210, PH = 297, M = 10, LW = PW - 2 * M, TOPO = 12, BASE = PH - 12;
      let y = TOPO, pagina = 1;
      for (let i = 0; i < blocos.length; i++) {
        prog(`Montando página ${pagina}… (${Math.round((i / blocos.length) * 100)}%)`);
        const canvas = await h2c(blocos[i], {
          scale: 2, backgroundColor: '#ffffff', logging: false, useCORS: true, windowWidth: 1280,
          onclone: d => { d.documentElement.setAttribute('data-theme', 'light'); d.documentElement.classList.add('dz-pdf-modo'); },
        });
        let w = LW, h = canvas.height * LW / canvas.width;
        if (h > BASE - TOPO) { h = BASE - TOPO; w = canvas.width * h / canvas.height; }
        if (y + h > BASE && y > TOPO) { doc.addPage(); pagina++; y = TOPO; }
        doc.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', M + (LW - w) / 2, y, w, h, undefined, 'FAST');
        y += h + 3.5;
      }
      const total = doc.getNumberOfPages();
      for (let p = 1; p <= total; p++) {
        doc.setPage(p); doc.setFontSize(8); doc.setTextColor(120);
        doc.text(`Pinholog · ${meta.cliente || 'Operação'} · ${txtPer}`, M, PH - 6);
        doc.text(`página ${p} de ${total}`, PW - M, PH - 6, { align: 'right' });
      }
      prog('Pronto');
      return doc;
    } finally { host.remove(); }
  }
  async function baixarPdf(procs, meta, aoProgresso) {
    const doc = await gerarPdf(procs, meta, aoProgresso);
    doc.save(nomeArq(meta.arquivo || ('Pinholog - ' + (meta.cliente || 'Operação')), 'pdf'));
  }
  return { lib, planilha, bytesXlsx, baixarXlsx, gerarPdf, baixarPdf, nomeArq };
})();

</script>
<script>
const PT_ORIGEM = 'https://cckawwulslgcdbtkqlti.supabase.co/storage/v1/object/public/paineis/';
let ptDados = null, ptPreset = '90';
function ptTema() {
  const atual = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const novo = atual === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', novo);
  try { localStorage.setItem('painel_tema', novo); } catch (e) {}
  if (ptDados) ptRender();
}
function ptErro(titulo, texto) {
  document.getElementById('pt-main').innerHTML = `<div class="pt-msg"><div style="font-size:34px;">🔒</div><h2>${Dash.esc(titulo)}</h2><p>${Dash.esc(texto)}</p></div>`;
}
function ptRelativo(isoTxt) {
  const min = Math.round((Date.now() - new Date(isoTxt)) / 60000);
  if (min < 1) return 'agora mesmo'; if (min < 60) return `há ${min} min`;
  const h = Math.round(min / 60); if (h < 24) return `há ${h} h`;
  return new Date(isoTxt).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
}
async function ptCarregar() {
  const token = (location.hash || '').replace(/^#/, '').replace(/[^a-z0-9]/gi, '');
  if (token.length < 16) { ptErro('Link incompleto', 'Confira se o link foi copiado inteiro ou peça um novo ao seu atendimento Pinholog.'); return; }
  try {
    const r = await fetch(PT_ORIGEM + token + '.json?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) { ptErro('Link indisponível', 'Este painel foi desativado ou o link não existe. Peça um novo link ao seu atendimento Pinholog.'); return; }
    const d = await r.json();
    if (d.expira_em && new Date(d.expira_em) < new Date()) { ptErro('Link expirado', 'O prazo deste link terminou. Peça um novo link ao seu atendimento Pinholog.'); return; }
    ptDados = d;
    document.title = (d.titulo || 'Painel de embarques') + ' — Pinholog';
    ptRender();
  } catch (e) { if (!ptDados) ptErro('Não foi possível carregar', 'Verifique sua conexão e tente novamente em instantes.'); }
}
function ptRender() {
  const d = ptDados;
  const procs = (d.processos || []).map(p => Object.assign({ cliente: d.cliente }, p));
  const main = document.getElementById('pt-main');
  const presets = [['30', '30 dias'], ['90', '90 dias'], ['mes', 'Este mês'], ['tudo', 'Tudo']];
  main.innerHTML = `<div class="pt-head">
      <div><div class="pt-kicker">${Dash.esc(d.titulo && d.titulo.includes('—') ? d.titulo.split('—')[0].trim() : 'Painel de embarques')}</div>
      <h1 class="pt-h1">${Dash.esc(d.cliente)}</h1>
      <div class="pt-sub">Acompanhe seus embarques com a Pinholog — situação, volumes e nível de serviço.</div></div>
      <div class="seg">${presets.map(([v, t]) => `<button class="${v === ptPreset ? 'on' : ''}" onclick="ptPreset='${v}';ptRender()">${t}</button>`).join('')}</div>
    </div><div id="pt-dash"></div>`;
  Dash.render(document.getElementById('pt-dash'), procs, { modo: 'cliente', periodo: Dash.periodo(ptPreset), opcoes: d.opcoes || {} });
  document.getElementById('pt-live').style.display = '';
  document.getElementById('pt-atualizado').textContent = 'Atualizado ' + ptRelativo(d.gerado_em);
  document.getElementById('pt-foot').style.display = '';
}
function ptToast(t, ms) {
  let el = document.getElementById('pt-toast');
  if (!el) { el = document.createElement('div'); el.id = 'pt-toast'; el.className = 'pt-toast'; document.body.appendChild(el); }
  el.textContent = t; el.style.display = ''; clearTimeout(el._t); if (ms) el._t = setTimeout(() => { el.style.display = 'none'; }, ms);
}
async function ptExportar(tipo) {
  if (!ptDados) return;
  const d = ptDados, bts = [document.getElementById('pt-bt-pdf'), document.getElementById('pt-bt-xlsx')];
  const procs = (d.processos || []).map(p => Object.assign({ cliente: d.cliente }, p));
  const per = Dash.periodo(ptPreset);
  const meta = { modo: 'cliente', periodo: per, opcoes: d.opcoes || {}, cliente: d.cliente, titulo: d.titulo, kicker: 'Relatório de embarques', arquivo: 'Pinholog - ' + d.cliente };
  bts.forEach(b => b.disabled = true);
  try {
    if (tipo === 'pdf') await DashExport.baixarPdf(procs, meta, t => ptToast('⏳ ' + t));
    else { ptToast('⏳ Gerando planilha…'); await DashExport.baixarXlsx(Dash.noPeriodo(procs, per), meta); }
    ptToast('✅ Arquivo baixado', 2500);
  } catch (e) { ptToast('Não foi possível gerar o arquivo: ' + e.message, 5000); }
  finally { bts.forEach(b => b.disabled = false); }
}
window.addEventListener('hashchange', ptCarregar);
ptCarregar();
setInterval(ptCarregar, 5 * 60 * 1000);
</script>
